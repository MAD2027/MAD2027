# ─────────────────────────────────────────────────────────────
# 팀 구성 단일 진실 공급원 (Single Source of Truth)
#
# 팀 추가/삭제/이름 변경은 이 파일만 수정한 뒤
#   python3 scripts/teams.py sync
# 를 실행하면 CODEOWNERS, 라벨, 이슈 템플릿, PR 자동 라벨 규칙,
# 릴리스 노트 분류가 모두 다시 생성된다. (CI가 동기화 여부를 검사함)
# 자세한 절차: docs/TEAM_GUIDE.md "팀 구성 변경하기"
# ─────────────────────────────────────────────────────────────

# GitHub Organization 이름 (예: mad2027). docs/ORG_SETUP.md 참고
org: MAD2027

# 저장소 관리자 GitHub 팀 slug: Organization 초대·팀 배치·보호 규칙을 맡고, 공용 파일 리뷰 요청을 받는다.
# 팀장 개념은 없다 (이슈 #62). 모든 팀은 나란히 있고, 리뷰 요청은 같은 팀끼리 간다.
maintainers_team: maintainers

teams:
  - id: camera                  # 브랜치 접두사/라벨/폴더에 쓰이는 영문 ID (소문자, 하이픈)
    name: 카메라                 # 사람이 읽는 이름
    description: 카메라 기반 인지 (차선/객체/신호 인식)
    github_team: team-camera    # Organization 안의 GitHub 팀 slug (push 권한, @멘션, 리뷰 요청)
    # code_owners: 팀 폴더 PR 의 리뷰 자동 요청 대상 (.github/CODEOWNERS). 승인은 필수가 아님 (이슈 #51).
    #   team = 이 팀의 github_team, all_teams = 모든 팀, maintainers = 저장소 관리자
    #   생략하면 github_team 이 있으면 [team], 없으면 [all_teams]
    color: "1d76db"
    paths:
      - src/camera/

  - id: gps
    name: GPS
    description: GPS/IMU 기반 측위 및 경로
    github_team: team-gps
    color: "0e8a16"
    paths:
      - src/gps/

  - id: lidar
    name: 라이다
    description: 라이다 기반 인지 (장애물/거리)
    github_team: team-lidar
    color: "5319e7"
    paths:
      - src/lidar/

  - id: control
    name: 제어
    description: 판단/제어 및 아두이노 펌웨어
    github_team: team-control
    color: "d93f0b"
    paths:
      - src/control/
      - firmware/

  # 센서 융합 + 판단: 각 센서 팀의 출력을 받아 하나로 합친다. 전용 GitHub 팀 없이 4팀이 함께 맡는다.
  - id: fusion
    name: 융합
    description: 센서 융합과 판단 (카메라·GPS·라이다 출력을 합쳐 자율주행 상황 판단) - 4팀 공동
    github_team: ""             # 전용 팀 없음 → 리뷰 요청은 모든 팀(all_teams)
    code_owners: [all_teams]
    color: "fbca04"
    paths:
      - src/fusion/

# 여러 팀이 함께 쓰는 공용 영역. 변경 시 모든 팀에 알림이 간다.
shared:
  - path: src/interfaces/       # 팀 간 메시지 정의 (계약). 변경은 영향 받는 팀마다 한 명 이상 동의
    owners: [all_teams]
    notify_all_teams: true
  - path: src/bringup/          # 전체 시스템 통합 런치
    owners: [maintainers]
    notify_all_teams: true
  - path: config/
    owners: [maintainers]
    notify_all_teams: false
  - path: .github/
    owners: [maintainers]
    notify_all_teams: false
  - path: .devcontainer/
    owners: [maintainers]
    notify_all_teams: false
